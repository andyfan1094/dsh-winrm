# dsh-winrm bundle patch: inserts the dual-face plugin row into the web
# profile roster. The row is a bare plugin by package name: the node half
# (exports ".") runs in the host process (WinRM engine, /api/dsh-winrm
# routes, agent tools), and the dsh.client declaration in package.json makes
# the browser half (exports "./client") load in the web GUI.
- insert:
    - id: winrm
      name: 'dsh-winrm'
